# git-cliff configuration: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md from conventional commits.
#
#   git cliff --tag 13.1.0 --output CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to the TYPO3 extension "golb" are documented in this
file. The format is based on conventional commits; the major version
follows the supported TYPO3 major version (13.x.x for TYPO3 13, 14.x.x
for TYPO3 14).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build|^ci", group = "<!-- 5 -->Build and CI" },
  { message = "^style|^test|^chore", skip = true },
]
filter_commits = false
tag_pattern = "[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
