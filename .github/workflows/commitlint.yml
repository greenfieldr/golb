name: Commit messages

# Pull requests are linted completely. On a push only the head commit is
# checked, because the history before the switch to conventional commits
# would fail the check on fast-forwards of the release branches.
on:
  pull_request:
  push:

jobs:
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          commitDepth: ${{ github.event_name == 'push' && 1 || 0 }}
