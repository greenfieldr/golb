name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: GitHub release and TER upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The secrets context is not available in step conditions, so the
      # token is passed through the job environment.
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # TER rejects an upload whose version differs from ext_emconf.php.
      - name: Check ext_emconf.php version
        run: |
          emconf=$(php -r '$_EXTKEY = "golb"; $EM_CONF = []; require "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')
          if [ "$emconf" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::ext_emconf.php has version $emconf, the tag is ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # --current renders the release of the pushed tag; --latest would pick
      # the newest tag of the whole repository by commit date, which is the
      # tag of another release branch when both lines are released together.
      # --use-branch-tags only considers the tags reachable from the pushed
      # tag, so the previous release of the same line starts the range.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --current --use-branch-tags --strip header

      # The notes of the wrong release would end up on GitHub and in TER.
      - name: Check release notes version
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          if ! printf '%s\n' "$RELEASE_NOTES" | head -n 1 | grep -qF "[${{ steps.version.outputs.version }}]"; then
            echo "::error::The release notes do not start with version ${{ steps.version.outputs.version }}"
            printf '%s\n' "$RELEASE_NOTES" | head -n 3
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}

      - name: Install TYPO3 Tailor
        run: composer global require typo3/tailor --no-interaction --no-progress

      # Requires the repository secret TYPO3_API_TOKEN (an access token
      # created at https://extensions.typo3.org/my-access-tokens). The upload
      # uses the GitHub archive of the tag, so files marked export-ignore in
      # .gitattributes are not shipped.
      - name: Publish to TER
        if: ${{ env.TYPO3_API_TOKEN != '' }}
        env:
          TYPO3_EXTENSION_KEY: golb
          RELEASE_NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish \
            --comment "$(printf '%s' "$RELEASE_NOTES" | head -c 1900)" \
            --artefact "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${{ steps.version.outputs.version }}.zip" \
            "${{ steps.version.outputs.version }}" golb
