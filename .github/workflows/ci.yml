name: CI

on:
  push:
  pull_request:

jobs:
  code-quality:
    name: Code quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Coding standards
        run: composer ci:php:cs

      - name: PHPStan
        run: composer ci:php:stan

      - name: Rector (dry run)
        run: composer ci:php:rector

      - name: Fractor (dry run)
        run: composer ci:fractor

  tests:
    name: Tests (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        typo3: ['^13.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction "typo3/cms-core:${{ matrix.typo3 }}"
          composer install --no-interaction --no-progress

      - name: Unit tests
        run: composer ci:tests:unit

      - name: Functional tests (SQLite)
        env:
          typo3DatabaseDriver: pdo_sqlite
        run: composer ci:tests:functional

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests with coverage
        run: composer ci:coverage:unit

      - name: Functional tests with coverage
        env:
          typo3DatabaseDriver: pdo_sqlite
        run: composer ci:coverage:functional

      - name: Merge coverage reports
        run: composer ci:coverage:merge

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: .Build/coverage/clover.xml
          format: clover
          fail-on-error: false

  documentation:
    name: Documentation rendering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render documentation
        run: |
          mkdir -p Documentation-GENERATED-temp
          docker run --rm --pull always \
            -v "$(pwd)":/project \
            ghcr.io/typo3-documentation/render-guides:latest \
            --config=Documentation --no-progress --fail-on-log
