<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Renders the pagination of the list view.

    Variables: paginator (ArrayPaginator), pagination (SimplePagination),
    demand (PostsDemand). Page links carry the "demand[currentPage]" plugin
    argument; other demand arguments of the current request are not kept.
</f:comment>
<f:if condition="{paginator.numberOfPages} > 1">
    <nav class="golb-pagination" aria-label="{f:translate(key: 'pagination.label')}">
        <ul class="golb-pagination__list">
            <f:if condition="{pagination.previousPageNumber}">
                <li class="golb-pagination__item golb-pagination__item--first">
                    <f:render section="PageLink" arguments="{pageNumber: pagination.firstPageNumber, label: '{f:translate(key: \'pagination.first\')}', rel: ''}"/>
                </li>
                <li class="golb-pagination__item golb-pagination__item--previous">
                    <f:render section="PageLink" arguments="{pageNumber: pagination.previousPageNumber, label: '{f:translate(key: \'pagination.previous\')}', rel: 'prev'}"/>
                </li>
            </f:if>

            <f:for each="{pagination.allPageNumbers}" as="pageNumber">
                <f:if condition="{pageNumber} == {paginator.currentPageNumber}">
                    <f:then>
                        <li class="golb-pagination__item golb-pagination__item--current" aria-current="page">
                            <span class="golb-pagination__link golb-pagination__link--current">{pageNumber}</span>
                        </li>
                    </f:then>
                    <f:else>
                        <li class="golb-pagination__item">
                            <f:render section="PageLink" arguments="{pageNumber: pageNumber, label: pageNumber, rel: ''}"/>
                        </li>
                    </f:else>
                </f:if>
            </f:for>

            <f:if condition="{pagination.nextPageNumber}">
                <li class="golb-pagination__item golb-pagination__item--next">
                    <f:render section="PageLink" arguments="{pageNumber: pagination.nextPageNumber, label: '{f:translate(key: \'pagination.next\')}', rel: 'next'}"/>
                </li>
                <li class="golb-pagination__item golb-pagination__item--last">
                    <f:render section="PageLink" arguments="{pageNumber: pagination.lastPageNumber, label: '{f:translate(key: \'pagination.last\')}', rel: ''}"/>
                </li>
            </f:if>
        </ul>
    </nav>
</f:if>

<f:section name="PageLink">
    <f:if condition="{pageNumber} > 1">
        <f:then>
            <f:link.action arguments="{demand: {currentPage: pageNumber}}" rel="{rel}" class="golb-pagination__link">{label}</f:link.action>
        </f:then>
        <f:else>
            <f:link.action rel="{rel}" class="golb-pagination__link">{label}</f:link.action>
        </f:else>
    </f:if>
</f:section>
</html>
