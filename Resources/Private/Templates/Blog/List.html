<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>

<f:section name="Main">
    <f:if condition="{paginator.paginatedItems}">
        <f:then>
            <ul class="golb-list golb-list--list">
                <f:for each="{paginator.paginatedItems}" as="post">
                    <li class="golb-list__item">
                        <f:render partial="Post" arguments="{post: post, settings: settings}"/>
                    </li>
                </f:for>
            </ul>
            <f:render partial="Pagination" arguments="{paginator: paginator, pagination: pagination, demand: demand}"/>
        </f:then>
        <f:else>
            <p class="golb-list__empty"><f:translate key="list.empty"/></p>
        </f:else>
    </f:if>
</f:section>
</html>
