# Route enhancers for the Golb plugins: speaking URLs for the pagination and
# the category and tag filters of the List view plugin.
#
# Import the file into the site configuration (config/sites/<identifier>/config.yaml):
#
#   imports:
#     - { resource: 'EXT:golb/Configuration/Routing/RouteEnhancers.yaml' }
#
# and restrict the enhancer to the pages with a List view plugin below the
# import, the imported configuration is merged with the site configuration:
#
#   routeEnhancers:
#     GolbList:
#       limitToPages: [12]
#
# The Latest view plugin does not generate URL parameters; its category and
# tag links point to the List view plugin and use these routes.
#
# Resulting URLs (plugin on /blog):
#
#   /blog                          first page, no arguments (also the "Show all posts" link)
#   /blog/page/2                   demand[currentPage]=2
#   /blog/tag/typo3                demand[tag]=<uid of the tag with slug "typo3">
#   /blog/tag/typo3/page/2
#   /blog/category/News-7          demand[category]=7
#   /blog/category/News-7/page/2
#
# The filters require "Allow demand overwrite" in the plugin. Tags use their
# slug field. System categories have no slug, so the category routes carry
# the title and the uid of the record; copy the file and change the aspect
# if you prefer a different pattern.
routeEnhancers:
  GolbList:
    type: Extbase
    extension: Golb
    plugin: ListView
    routes:
      - routePath: '/'
        _controller: 'Blog::list'
      - routePath: '/page/{page}'
        _controller: 'Blog::list'
        _arguments:
          page: 'demand/currentPage'
      - routePath: '/tag/{tag}'
        _controller: 'Blog::list'
        _arguments:
          tag: 'demand/tag'
      - routePath: '/tag/{tag}/page/{page}'
        _controller: 'Blog::list'
        _arguments:
          tag: 'demand/tag'
          page: 'demand/currentPage'
      - routePath: '/category/{category}'
        _controller: 'Blog::list'
        _arguments:
          category: 'demand/category'
      - routePath: '/category/{category}/page/{page}'
        _controller: 'Blog::list'
        _arguments:
          category: 'demand/category'
          page: 'demand/currentPage'
    defaultController: 'Blog::list'
    aspects:
      page:
        type: StaticRangeMapper
        start: '1'
        end: '999'
      tag:
        type: PersistedAliasMapper
        tableName: tx_golb_domain_model_tag
        routeFieldName: slug
      category:
        type: PersistedPatternMapper
        tableName: sys_category
        routeFieldPattern: '^(?P<title>.+)-(?P<uid>\d+)$'
        routeFieldResult: '{title}-{uid}'
